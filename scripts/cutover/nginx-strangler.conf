server {
    listen 80;
    server_name sdm.local;

    # Rotas já migradas para o PHP (Strangler Fig)
    # Fase 1: Support / CEP
    location /api/v1/support/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fase 2: Identity & Customers
    location /api/v1/auth/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
    }
    location /api/v1/customers/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
    }

    # Fase 3: SalesOps
    location /api/v1/sales/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
    }

    # Fase 4: Finance & BI
    location /api/v1/finance/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
    }
    location /api/v1/bi/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
    }

    # Frontend React Modernizado (SPA)
    location / {
        proxy_pass http://localhost:5173; # Vite / Build estático
        proxy_set_header Host $host;
    }

    # Fallback para o legado ColdFusion (Caso algo falhe ou não tenha sido migrado)
    location /legacy/ {
        proxy_pass http://coldfusion-server:8500/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
